<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in or create your account | Habit Tracker</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0D0F">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Manrope:wght@300..700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="auth-wrap">
  <a class="mark" href="./?landing=1" aria-label="Habit Tracker, home"><i></i>Habit Tracker</a>
  <section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-tabs" role="tablist" aria-label="Account">
      <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="authForm">Sign in</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="authForm">Create account</button>
    </div>
    <h1 id="auth-title">Welcome back.</h1>
    <p class="sub" id="auth-sub">Pick up your streak where you left it.</p>
    <form id="authForm" novalidate>
      <div class="field" id="f-name" hidden>
        <label for="name">Your name <span class="muted">(optional)</span></label>
        <input type="text" id="name" maxlength="30" autocomplete="name" placeholder="What should we call you?">
      </div>
      <div class="field" id="f-email">
        <label for="email">Email</label>
        <input type="email" id="email" maxlength="254" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field" id="f-pass">
        <label for="password" id="pw-label">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" maxlength="128" autocomplete="current-password" required aria-describedby="pw-hint">
          <button type="button" class="pw-toggle" id="pwToggle" aria-pressed="false" aria-controls="password">Show</button>
        </div>
      </div>
      <p class="hint" id="pw-hint" hidden>At least 10 characters. A short phrase you will remember works well.</p>
      <p class="ok" id="ok" role="status" aria-live="polite"></p>
      <p class="err" id="err" role="alert" aria-live="assertive"></p>
      <button class="btn primary wide" id="submit" type="submit">Sign in</button>
    </form>
    <p class="switch"><button type="button" id="forgotLink">Forgot your password?</button></p>
    <p class="switch" id="switch"></p>
  </section>
  <p class="fine">Your data is private to your account. Export it or delete it permanently at any time from the Account page.</p>
</main>
<script src="js/auth.js"></script>
</body>
</html>
